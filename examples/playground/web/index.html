<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>GX Playground · WebAssembly · 内置 LSP</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
           background: #020617; color: #e2e8f0; min-height: 100vh;
           display: flex; flex-direction: column; align-items: center; padding: 16px;
           overflow-x: auto; }
    /* Apple 浅色主题：切换按钮写 body[data-theme=light]，视口底色随之换肤。
       编辑器选区色由 GX 的 &::selection 子表统一提供，Web 后端注入 ::selection
       规则读取元素上的 --gx-sel-bg / --gx-sel-fg（见 backend/web/stylemap.go）。 */
    body[data-theme="light"] { background: #f2f2f7; color: #1e1e1e; }
    #app { outline: none; flex: none; user-select: none; -webkit-user-select: none; }
    /* 移动端软键盘代理：隐藏但必须可聚焦（display:none 无法唤起键盘）。
       关键：不能用 pointer-events:none——iOS Safari 会判定该元素不可交互，
       focus 后立刻 blur，表现就是键盘“弹起马上又收起”。这里保持它可交互，
       仅用 opacity:0 + 极小尺寸隐藏；font-size:16px 防止 iOS 聚焦时自动缩放。
       软键盘输入经 input/composition 事件转成 wasm 编辑命令，桌面鼠标路径不依赖它。 */
    #mobile-input { position: fixed; left: 0; top: 0; width: 1px; height: 1px;
                    padding: 0; border: 0; outline: 0; opacity: 0;
                    font-size: 16px; color: transparent; background: transparent;
                    caret-color: transparent; z-index: -1; }
    /* GX 场景树用 style 属性声明 flex-direction；浏览器需显式 display:flex 才生效。 */
    #app [style*="flex-direction"] { display: flex; }
    /* overflow 由 GX 后端 setProperty 精确设置（auto/hidden 各自保留），
       这里不再用 [style*="overflow"] 粗匹配覆盖——否则编辑器的
       overflow:hidden（裁掉隐藏行）会被强制成 auto 导致空行撑高。 */
    #app div { box-sizing: border-box; }
    /* Editor 样式已全部迁入 GX 组件 prop，无需宿主 CSS：
       渐变文字=gradient-text、选区色=&::selection、字体=font-family、
       光标闪烁=animation="blink 1.06s infinite"、点击穿透=pointer-events="none"。
       @keyframes 由 Web 后端首次使用时注入（gx-animation-css）。 */
    #hint { margin-top: 10px; font-size: 12px; color: #64748b; }

    /* ---- 内建 LSP UI（无服务端，全部由 wasm 侧 goxlsp 驱动） ---- */
    #lsp-diagnostics { width: 1180px; max-width: 100%; min-height: 28px; margin-top: 8px;
                       display: flex; flex-direction: column; gap: 4px;
                       font-size: 12px; color: #8b949e; }
    #lsp-diagnostics.lsp-ok .lsp-title { color: #3fb950; }
    #lsp-diagnostics.lsp-errors .lsp-title { color: #f85149; }
    .lsp-title { font-weight: 600; }
    .lsp-diag-item { align-self: flex-start; text-align: left; background: transparent;
                     border: 0; border-left: 2px solid #f85149; color: #d0d7de;
                     padding: 2px 8px; font: inherit; cursor: pointer; }
    .lsp-diag-item:hover { background: #21262d; color: #fff; }

    #lsp-completion { position: fixed; z-index: 30; min-width: 220px; max-height: 260px;
                      overflow-y: auto; background: #161b22; border: 1px solid #30363d;
                      border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.5);
                      font: 12px ui-monospace, Menlo, Consolas, monospace; color: #c9d1d9; }
    #lsp-completion[hidden], #lsp-hover[hidden] { display: none; }
    .lsp-completion-row { padding: 4px 10px; cursor: pointer; }
    .lsp-completion-row:hover, .lsp-completion-row.selected { background: #1f6feb; color: #fff; }

    #lsp-hover { position: fixed; z-index: 40; max-width: 320px; padding: 8px 10px;
                 background: #1c2128; border: 1px solid #30363d; border-radius: 6px;
                 box-shadow: 0 6px 18px rgba(0,0,0,.5); font-size: 12px; color: #c9d1d9;
                 line-height: 1.5; }

    #loading { position: fixed; inset: 0; display: grid; place-items: center;
               font-size: 14px; color: #94a3b8; background: #020617; z-index: 10; }
    #loading[data-state="error"] { color: #f87171; }

    /* ---- 滚动条样式（GX 场景树的 overflow:auto/scroll 容器全部生效） ----
       深色主题：细条半透明滑块；浅色主题跟随 body[data-theme=light] 换色。
       Firefox 用 scrollbar-width/color 两个标准属性，其余浏览器走 webkit 伪元素。 */
    #app ::-webkit-scrollbar { width: 10px; height: 10px; }
    #app ::-webkit-scrollbar-thumb {
      background: rgba(100,116,139,.38); border-radius: 6px;
      border: 2px solid transparent; background-clip: content-box;
    }
    #app ::-webkit-scrollbar-thumb:hover { background-color: rgba(100,116,139,.6); }
    #app ::-webkit-scrollbar-track, #app ::-webkit-scrollbar-corner { background: transparent; }
    #app * { scrollbar-width: thin; scrollbar-color: rgba(100,116,139,.38) transparent; }
    body[data-theme="light"] #app ::-webkit-scrollbar-thumb {
      background: rgba(100,116,139,.35); background-clip: content-box;
    }
    body[data-theme="light"] #app ::-webkit-scrollbar-thumb:hover { background-color: rgba(100,116,139,.55); }
    body[data-theme="light"] #app * { scrollbar-color: rgba(100,116,139,.35) transparent; }
  </style>
</head>
<body>
  <div id="loading">正在加载 GX Playground wasm（含内建 LSP）…</div>
  <div id="app" tabindex="0"></div>
  <!-- 移动端软键盘代理：点击代码区时聚焦它唤起输入法；桌面鼠标路径不依赖它。 -->
  <textarea id="mobile-input" autocomplete="off" autocapitalize="off"
            autocorrect="off" spellcheck="false" aria-label="GX 代码输入"></textarea>
  <div id="lsp-diagnostics">LSP 初始化中…</div>
  <div id="hint">正在初始化…</div>
  <div id="lsp-completion" hidden></div>
  <div id="lsp-hover" hidden></div>
  <!-- wasm_exec.js 由 Go 工具链生成（非本仓手写），提供全局 window.Go -->
  <script src="wasm_exec.js"></script>
  <!-- 前端逻辑为严格 TS 7，编译产物见 dist/main.js -->
  <script type="module" src="dist/main.js"></script>
</body>
</html>
