# GX CI（拆仓布局适配版）：gox-sample + gox-core + gox-backend 三仓联测。
#
# 拆仓后 go.work 以 ../gox-core、../gox-backend 相对路径引用兄弟仓，CI 需要
# 把两个兄弟仓检出到 gox-sample 旁边（见「检出兄弟仓」步骤），否则 go.work
# 解析失败、Rust crate 的老路径 backend/rust/rust 也不复存在。
#
# test job（矩阵 ubuntu + windows）：
#   - 全量 Go 测试（Windows 下先装 mingw，cgo 包才能编译）
#   - 全 module 测试（根 ./... 覆盖不到的嵌套 module：playground/gox-tui/
#     gox-term/gox-idea/backend/*；含 TUI 真 PTY E2E 与 Playground UI E2E）
#   - Playground 按功能 E2E（Playwright + Chromium，用例清单见
#     scripts/e2e/playground_features.py 的 CASES；Windows 侧先允许失败，
#     稳定后去掉 continue-on-error 转为硬门禁）
#   - gox-idea GUI E2E（真实鼠标/键盘，78 项断言：点击/拖动/滚轮/分隔条/
#     标签/项目树/resize/图标像素/主流程；统一入口 tests/run_gui_e2e_all.sh，
#     跨平台驱动 tests/gui_driver.py + shims/；Linux 硬门禁，Windows 观察）
#   - 三端一致性矩阵（Linux 硬门禁）：testdata/threeway/cases.json 共享用例
#     经 Web/Skia/Rust 三端无头消费并断言，覆盖样式属性实现与传值正确性
#   - Desktop Playground GUI E2E（28 项：点击定位/三击选行复制两个历史 bug
#     回归 + 键盘/滚轮/主题/Run/示例/resize；脚本 examples/playground/tests/
#     gui_e2e.sh，复用 gox-idea 的 shims；Linux 硬门禁，Windows 观察）
# build-windows job：测试通过后编译自包含 exe（yoga Windows 静态库从源码
#   编译，见 scripts/build-windows-msys2.sh 与 docs/windows-build.md），
#   上传 artifact；打 tag（v*）时额外创建 GitHub Release。
name: CI
# 注意：本文件暂存于 workflows-test/（推送凭证缺 workflow scope）。
# 启用方式：把目录改名为 .github/workflows/ 即可，其余内容不用动。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Go 测试 + 按功能 E2E（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # 拆仓布局：go.work 引用 ../gox-core、../gox-backend。检出为兄弟目录
      # （$GITHUB_WORKSPACE 的上级），与 go.work 的相对路径严格对应。
      # token 传递兼容私有仓；公开仓带 token 也能正常 clone。
      - name: 检出兄弟仓 gox-core / gox-backend
        shell: bash
        run: |
          git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/robertpanvip/gox-core.git" "$GITHUB_WORKSPACE/../gox-core"
          git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/gox-projects/gox-backend.git" "$GITHUB_WORKSPACE/../gox-backend"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Linux 侧安装 Rust：Rust 渲染后端单测 + cgo 适配层所需的静态库
      # （libgxbackend_rust）都靠它；三端一致性矩阵也依赖 cargo。
      - name: 安装 Rust stable（Linux）
        if: runner.os == 'Linux'
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        if: runner.os == 'Linux'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ../gox-backend/rust/rust

      # Windows：cgo（desktop/yoga 绑定）需要 mingw 工具链，Go 测试前先装好。
      - name: 安装 MSYS2 / mingw-w64 工具链
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: git mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils
          # 继承宿主 PATH：setup-go 注入的 go.exe 必须在 msys2 shell 里可用，
          # 否则后续 Go 测试步骤报 exit 127（go: command not found）。
          path-type: inherit

      - name: Rust 后端单测 + 静态库（Linux）
        if: runner.os == 'Linux'
        run: |
          cargo test --manifest-path ../gox-backend/rust/rust/Cargo.toml
          cargo build --release --manifest-path ../gox-backend/rust/rust/Cargo.toml

      # 拆仓后主 module（根目录）不再承载 Go 代码，`./...` 会匹配不到包。
      # 有包才跑，没包直接 SKIP，避免 exit 1 假红；真正的测试在
      # run_all_module_tests.sh（覆盖所有嵌套 module）里。
      - name: 全量 Go 测试
        if: runner.os == 'Linux'
        run: |
          PKGS=$(go list ./... 2>/dev/null || true)
          if [ -n "$PKGS" ]; then
            go test $PKGS -count=1
          else
            echo "SKIP: 主 module 无包（拆仓后根目录不再承载 Go 代码），全量测试走 run_all_module_tests.sh"
          fi

      # Windows 全量测试先观察（cgo 包需要 yoga 等预编译库，见
      # build-windows job 的脚本），稳定后再转硬门禁。
      - name: 全量 Go 测试（Windows 观察）
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: msys2 {0}
        run: |
          PKGS=$(go list ./... 2>/dev/null || true)
          if [ -n "$PKGS" ]; then
            go test $PKGS -count=1
          else
            echo "SKIP: 主 module 无包（拆仓后根目录不再承载 Go 代码）"
          fi

      # 根 `go test ./...` 只覆盖主 module；go.work 里的嵌套 module
      # （playground / gox-tui / gox-term / gox-idea / backend/*）不在 ./... 内。
      # 统一入口自动发现并逐个跑：含 TUI 真 PTY E2E、Playground UI E2E、
      # gox-idea 全部单测与 E2E。Rust 后端静态库未编译时自动跳过。
      - name: 全 module 单测（Linux 硬门禁）
        if: runner.os == 'Linux'
        run: bash scripts/e2e/run_all_module_tests.sh

      # 三端一致性矩阵：testdata/threeway/cases.json 的共享用例分别由
      # Web(memDriver 透传) / Skia(Yoga 布局+DrawLog) / Rust(Taffy+绘制指令)
      # 消费并按同一期望断言；任一端样式属性未实现 / 传值错误 / 语义漂移
      # 都会在此失败并点名具体用例。依赖上一步编译出的 Rust 静态库。
      # 三端一致性矩阵随三端后端一起迁到了 gox-backend 仓（testdata/threeway
      # + scripts/threeway-parity.sh）。迁移期脚本内部路径若尚未适配新布局，
      # 该仓需先行修正；此处仅在脚本存在时执行，避免因缺文件假红。
      - name: 三端一致性矩阵（Linux 硬门禁）
        if: runner.os == 'Linux'
        run: |
          if [ -f ../gox-backend/scripts/threeway-parity.sh ]; then
            bash ../gox-backend/scripts/threeway-parity.sh
          else
            echo "SKIP: ../gox-backend/scripts/threeway-parity.sh 不存在（三端矩阵待迁移）"
          fi

      - name: 全 module 单测（Windows 观察）
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: msys2 {0}
        run: bash scripts/e2e/run_all_module_tests.sh

      - name: 安装 Playwright（Python，Linux）
        if: runner.os == 'Linux'
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: 安装 Playwright（Python，Windows）
        if: runner.os == 'Windows'
        run: |
          pip install playwright
          playwright install chromium

      # 按功能 E2E（构建 wasm + 起服务 + 跑用例），脚本已做跨平台适配
      # （python3/python 自动探测）。Windows 侧先允许失败观察，稳定后转硬门禁。
      - name: 按功能 E2E
        continue-on-error: ${{ runner.os == 'Windows' }}
        run: bash scripts/e2e/run_playground_e2e.sh

      # ---- gox-idea GUI E2E（真实鼠标/键盘/图标/主流程，78 项断言）----
      # 三套脚本通过 shims/ + gui_driver.py 跨平台：Linux 用原生 X11 工具，
      # Windows 用 pyautogui。统一入口 run_gui_e2e_all.sh 依次跑三套并汇总。
      # Linux 为硬门禁；Windows 侧首次接入先 continue-on-error 观察（GUI 自动化
      # 在 CI runner 上的会话/分辨率与本地不同，稳定后去掉 continue-on-error）。
      - name: 安装 GUI E2E 依赖（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # GUI dev 头文件：gox-idea/playground 的 cgo 依赖（go-gl/glfw 要
          # X11 头、go-gl/gl 要 pkg-config gl、x/mobile 要 GLES3 头），缺了
          # 连编译期都过不去；fonts-noto-cjk 供 CJK 字体相关用例真实执行。
          # GLFW 的 X11 全套 dev 依赖：除 libx11 外还需要 xcursor/xrandr/
          # xinerama/xi 头文件（缺 Xcursor.h 时 go-gl/glfw 编译失败）。
          sudo apt-get install -y xvfb xdotool xclip imagemagick \
            libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev \
            libgles2-mesa-dev libgl-dev pkg-config fonts-noto-cjk
          pip install pillow

      - name: 安装 GUI E2E 依赖（Windows）
        if: runner.os == 'Windows'
        run: pip install pyautogui pygetwindow pillow

      - name: 构建 gox-idea（Linux）
        if: runner.os == 'Linux'
        run: cd cmd/gox-idea && go build -o /tmp/gox-idea-lg .

      # gox-idea 直接 import Rust 后端（libgxbackend_rust），链接期需要
      # Windows 版静态库。Rust crate 依赖 wgpu，windows-gnu 目标编译成本
      # 极高，CI 侧暂不编译——该步骤与 Windows GUI E2E 一样先观察，
      # 稳定方案（如 msvc 工具链出库）落地后再转硬门禁。
      - name: 构建 gox-idea.exe（Windows 观察）
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: msys2 {0}
        run: bash cmd/gox-idea/build-windows.sh

      - name: gox-idea GUI E2E（Linux 硬门禁）
        if: runner.os == 'Linux'
        run: bash cmd/gox-idea/tests/run_gui_e2e_all.sh
        env:
          GOX_IDEA_BIN: /tmp/gox-idea-lg

      - name: gox-idea GUI E2E（Windows 观察）
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 20
        shell: msys2 {0}
        run: bash cmd/gox-idea/tests/run_gui_e2e_all.sh
        env:
          GOX_IDEA_BIN: cmd/gox-idea/gox-idea.exe

      # ---- Desktop Playground GUI E2E（真实鼠标/键盘，28 项断言）----
      # 覆盖点击定位/三击选行复制两个历史严重 bug，及键盘/滚轮/主题/Run/
      # 示例切换/resize。命中框动态定位按钮，字宽运行时实测，不写死坐标。
      - name: 构建 Desktop Playground（Linux）
        if: runner.os == 'Linux'
        run: cd examples/playground && go build -o /tmp/pg-desktop-e2e ./desktop

      # GX-Playground.exe 链接 Rust 后端静态库（同 gox-idea.exe，见上），
      # Windows CI 侧暂无法提供，转观察；Linux 侧构建为硬门禁。
      - name: 构建 Desktop Playground（Windows 观察）
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: msys2 {0}
        run: bash scripts/build-windows-msys2.sh

      - name: Desktop Playground GUI E2E（Linux 硬门禁）
        if: runner.os == 'Linux'
        run: bash examples/playground/tests/gui_e2e.sh
        env:
          GOX_PLAYGROUND_BIN: /tmp/pg-desktop-e2e

      - name: Desktop Playground GUI E2E（Windows 观察）
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 20
        shell: msys2 {0}
        run: bash examples/playground/tests/gui_e2e.sh
        env:
          GOX_PLAYGROUND_BIN: GX-Playground.exe

      - name: 失败时上传截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-logs-${{ matrix.os }}
          path: |
            /tmp/pg_final.png
            examples/playground/web/build.log
            /tmp/gox-idea-e2e-app.log
            /tmp/gox-idea-i-app.log
            /tmp/gox-idea-v-app.log
            /tmp/pg-e2e-app.log
            /tmp/gox-idea-visual-dark.png
            /tmp/gox-idea-visual-light.png
          if-no-files-found: ignore

  # 暂时禁用：GX-Playground.exe 链接 libgxbackend_rust（Rust crate 依赖
  # wgpu，windows-gnu 目标编译成本极高且不稳定），Windows CI 侧无法提供
  # 该静态库。待 Rust 后端支持 Windows 工具链（msvc 出库 / wgpu gnu 修复）
  # 后恢复启用；本地 Windows 构建路径见 scripts/build-windows-msys2.sh。
  build-windows:
    name: Windows exe 构建
    if: false
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 安装 MSYS2 / mingw-w64 工具链
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: git mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils

      - name: 构建 GX-Playground.exe
        shell: msys2 {0}
        run: bash scripts/build-windows-msys2.sh

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: GX-Playground-windows-x64
          path: GX-Playground.exe

      - name: 发布 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: GX-Playground.exe
