# GX 编译器 CI：按功能 E2E 测试 + Windows exe 自动构建。
#
# test job：全量 Go 测试 → 构建 playground web 产物 → Playwright 按功能用例
#           （用例清单见 scripts/e2e/playground_features.py 的 CASES）。
# build-windows job：测试通过后在 windows runner 编译自包含 exe
#           （yoga Windows 静态库从源码编译，全流程脚本化，见
#           scripts/build-windows-msys2.sh 与 docs/windows-build.md），
#           上传 artifact；打 tag（v*）时额外创建 GitHub Release。
name: CI
# 注意：本文件暂存于 workflows-test/（推送凭证缺 workflow scope）。
# 启用方式：把目录改名为 .github/workflows/ 即可，其余内容不用动。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Go 测试 + 按功能 E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 全量 Go 测试
        run: go test ./... -count=1

      - name: 安装 Playwright（Python）
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: 按功能 E2E（构建 wasm + 起服务 + 跑用例）
        run: bash scripts/e2e/run_playground_e2e.sh

      - name: 失败时上传截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-logs
          path: |
            /tmp/pg_final.png
            examples/playground/web/build.log
          if-no-files-found: ignore

  build-windows:
    name: Windows exe 构建
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 安装 MSYS2 / mingw-w64 工具链
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: git mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils

      - name: 构建 GX-Playground.exe
        shell: msys2 {0}
        run: bash scripts/build-windows-msys2.sh

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: GX-Playground-windows-x64
          path: GX-Playground.exe

      - name: 发布 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: GX-Playground.exe
