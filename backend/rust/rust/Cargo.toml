[package]
name = "gxbackend_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "gxbackend_rust"
crate-type = ["staticlib"]

# GX 的 Rust 渲染后端：编译成 C 静态库，由 Go 侧 cgo 消费。
# 渲染内核来自已验证的独立 demo；新增 C ABI + 场景协议(JSON)解析。
[dependencies]
taffy = "0.5"
tiny-skia = "0.11"
wgpu = "25"
# 平台无关 raw handle（SurfaceProvider trait 返回值；wgpu 25 同版本传递依赖）
raw-window-handle = "0.6"
glyphon = "0.9"
winit = "0.30"
cosmic-text = "0.14"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# GPU quad 渲染管线（独立 crate backend/gpu：GPU 优先 / 打包期可选 CPU 接管）
gx_gpu = { path = "../../gpu" }

[features]
# Android 交叉编译（阶段 5）：winit 的 android-activity 依赖必须选一个后端
# feature（NativeActivity 是 x/mobile 路线的宿主）。真机构建：
#   cargo check/build --target aarch64-linux-android --features android-native-activity
android-native-activity = ["winit/android-native-activity"]
android-game-activity = ["winit/android-game-activity"]

# 静态库体积优化：LTO + 去符号 + 单代码单元 + 体积优先优化。
# 注意：不能用 panic="abort"，因为 gx_window_run 依赖 catch_unwind 把 panic 转成 rc=2。
[profile.release]
opt-level = "z"       # 体积优先
lto = "fat"           # 全量链接期优化，跨 crate 内联 + 死代码消除
codegen-units = 1     # 单代码单元，配合 LTO 最大化优化
strip = "symbols"     # 去除符号表与调试信息
panic = "unwind"      # 保留 unwind：C ABI 用 catch_unwind 兜底 panic
overflow-checks = false
